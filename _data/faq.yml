- category: biometricos
  question: "¿Los relojes biométricos ZKTeco incluyen software de control de asistencia sin pagos mensuales?"
  answer: "Sí. Todos nuestros relojes biométricos en Ecuador incluyen software de control de asistencia para gestionar horarios, turnos rotativos, atrasos y horas extras con exportación directa a Excel para nómina. En la modalidad de software local no pagas mensualidades ni licencias recurrentes; también ofrecemos BioTime en la nube para empresas multi-sucursal."

- category: biometricos
  question: "¿Realizan envíos e implementación de relojes biométricos en Quito, Guayaquil, Ambato, Cuenca y otras provincias?"
  answer: "Sí. Realizamos instalación presencial en sitio en Ambato y la zona centro del país, y despachamos diariamente equipos biométricos preconfigurados a Quito, Guayaquil, Cuenca, Manta, Machala, Loja y las 24 provincias de Ecuador mediante transporte asegurado, incluyendo configuración remota y capacitación en vivo."

- category: biometricos
  question: "¿Cómo funciona un reloj biométrico de huella y facial para evitar el fraude en marcaciones?"
  answer: "Nuestros equipos combinan sensores ópticos de huella dactilar con cámaras de reconocimiento facial infrarrojo con algoritmo anti-spoofing, que impide suplantaciones con fotografías impresas o pantallas de celular. Así garantizas que solo el colaborador presencial registre su entrada, salida o tiempo de almuerzo."

- category: biometricos
  question: "¿Qué pasa con el registro de asistencia si se corta el internet o la energía eléctrica?"
  answer: "El reloj biométrico guarda todas las marcaciones de huella y rostro en su memoria interna no volátil aunque no exista conexión a internet. Apenas se restablece la red, sincroniza los datos automáticamente con el software. Además, disponemos de modelos con batería de respaldo integrada (UPS) para seguir operando durante cortes eléctricos."

- category: biometricos
  question: "¿Qué garantía y soporte técnico tienen los equipos biométricos en Ecuador?"
  answer: "Entregamos equipos ZKTeco originales con factura comercial ecuatoriana, garantía real de fábrica contra defectos de hardware y soporte técnico especializado directo con ingenieros en Ecuador por WhatsApp, conexión remota o visita técnica."

- category: software
  question: "¿Qué tipos de desarrollo de software a la medida y programas para empresas realizan en Ecuador?"
  answer: "Desarrollamos programas empresariales adaptados al 100% a tu flujo operativo: sistemas ERP a medida (compras, inventario multi-bodega, ventas, cartera), facturación electrónica integrada al SRI, automatización de procesos internos, aplicaciones web B2B y conexión directa entre relojes biométricos y tu sistema de nómina."

- category: software
  question: "¿Quién es dueño del código fuente y la base de datos en un desarrollo de software a la medida?"
  answer: "Tu empresa conserva la titularidad y el control de su información y del sistema desarrollado según los términos del contrato. Entregamos software documentado, sin ataduras ocultas ni cobros por usuario adicional, desplegado en tu propio servidor local o en la nube de tu empresa."

- category: software
  question: "¿Cómo garantizan el cumplimiento de plazos, presupuesto y soporte técnico en proyectos de software?"
  answer: "Trabajamos mediante 4 fases con entregables verificables: levantamiento técnico con presupuesto cerrado, desarrollo iterativo con revisiones semanales, implementación con migración de datos y capacitación, y soporte técnico local en Ecuador con garantía post-implementación."

- category: general
  question: "¿Cómo puedo solicitar una cotización o demostración para mi empresa en Ecuador?"
  answer: "Puedes escribirnos directamente por WhatsApp al +593 99 392 0505 o completar el formulario de cotización en línea. Un ingeniero especialista evaluará la cantidad de colaboradores o los procesos que deseas automatizar y te enviará una propuesta formal en menos de 24 horas."
