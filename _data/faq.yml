- category: biometricos
  question: "¿Los relojes biométricos ZKTeco incluyen software de control de asistencia sin pagos mensuales?"
  answer: "Sí. Entregamos equipos ZKTeco con software de gestión de asistencia (local o en la nube según tu necesidad) para calcular atrasos, horas extras, turnos rotativos y exportar reportes en Excel listos para nómina. En la modalidad local no pagas mensualidades recurrentes."

- category: biometricos
  question: "¿Realizan instalación en sitio en Ambato y envíos a otras ciudades de Ecuador?"
  answer: "Sí. Contamos con instalación presencial, configuración de red y capacitación en sitio en Ambato y la provincia de Tungurahua. Para Quito, Guayaquil, Cuenca y el resto de Ecuador realizamos envíos asegurados con equipo preconfigurado y soporte remoto en vivo para la puesta en marcha."

- category: biometricos
  question: "¿Qué sucede con las marcaciones si se va el internet o la luz en la empresa?"
  answer: "Los terminales biométricos almacenan miles de registros en su memoria interna sin depender de internet. Cuando se restablece la conexión, los datos se sincronizan automáticamente con el software. Además, varios modelos admiten respaldo eléctrico (UPS o batería interna) para evitar interrupciones."

- category: biometricos
  question: "¿Cómo evitan la suplantación de identidad o fraude en las marcaciones?"
  answer: "Nuestros equipos combinan reconocimiento facial con tecnología anti-spoofing (detecta fotos o videos) y sensores ópticos de huella digital de alta precisión. Solo el colaborador presencial puede registrar su entrada o salida, eliminando el marcaje por terceros."

- category: software
  question: "¿Qué tipo de software a la medida desarrolla Dolsite para empresas en Ecuador?"
  answer: "Desarrollamos sistemas web y empresariales adaptados a la operación real de cada negocio: ERP modulares, facturación electrónica integrada al SRI, gestión de inventarios y bodegas, automatización de nómina y reportes gerenciales en tiempo real, además de integraciones con equipos biométricos."

- category: software
  question: "¿Cómo garantizan que el software a medida cumpla con los plazos y el presupuesto?"
  answer: "Trabajamos en cuatro fases claras con entregas parciales validables: levantamiento de procesos, arquitectura y desarrollo iterativo, implementación con migración de datos y soporte técnico evolutivo. Antes de escribir código entregamos un alcance técnico, cronograma y presupuesto cerrados."

- category: general
  question: "¿Qué garantía y soporte técnico ofrecen después de la implementación?"
  answer: "Todos los equipos biométricos cuentan con garantía local de hardware y soporte técnico directo en Ecuador (presencial en Ambato y remoto a nivel nacional). En proyectos de software a la medida incluimos acompañamiento post-lanzamiento, capacitación al personal y planes de mantenimiento evolutivo."
