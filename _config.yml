# ----
# Site

title: "Dolsite | Biométricos de Asistencia y Software a la Medida en Ecuador"
short_title: "Dolsite"
url: "https://dolsite.com"
baseurl: ""
lang: "es_EC"
locale: "es_EC"
google_analytics_key: "G-YLGVJ6D4D4"
gtm_id: "GTM-WM3MJJT5"

# SEO defaults
logo: "/logo.png"
default_og_image: "/images/biometrico.webp"
description: "Venta, instalación y soporte de relojes biométricos de asistencia (ZKTeco, BioTime) y desarrollo de software empresarial a la medida en Ambato y todo Ecuador."
author:
  name: "Dolsite Tech"
  email: "2005maldonado@gmail.com"
  twitter: ""
social:
  name: "Dolsite Tech"
  links:
    - "https://www.facebook.com/profile.php?id=61581708354224"

# -----
# Build

timezone: America/Guayaquil

collections:
  staff_members:
    _icon: account_circle
    _hide_content: true
    _options:
      image:
        width: 250
        height: 250

permalink: pretty

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      _options:
        content:
          width: 1880
          height: 1880
          uploads_dir: "/images/posts/"
  - scope:
      path: ""
    values:
      layout: "default"

# Form action (Mailchimp) & optional Cloudflare Turnstile sitekey
newsletter_action: "https://dolsite.us6.list-manage.com/subscribe/post?u=6db4ac2c575d1906e264a030b&id=a47d2caa18&f_id=0032b0e0f0"
turnstile_sitekey: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

# -----------
# CloudCannon

_options:
  header_background_image:
    width: 1880
    height: 1880
  og_image:
    width: 1200
    height: 630
  featured_image:
    width: 1200
    height: 800
